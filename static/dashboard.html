<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Agent System</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e1e4e9;
    --text: #1c2128;
    --muted: #6b7280;
    --accent: #3b5bdb;
    --good: #2f9e44;
    --warn: #e8590c;
    --bad: #e03131;
    --track: #edeef1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f26;
      --border: #2c313a;
      --text: #e7e9ee;
      --muted: #9aa2af;
      --accent: #7b96ff;
      --good: #51cf66;
      --warn: #ffa94d;
      --bad: #ff6b6b;
      --track: #262a33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  #provider-badge { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat-tile .value { font-size: 22px; font-weight: 600; }
  .stat-tile .label { color: var(--muted); font-size: 12px; }
  .dept-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .dept-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .dept-card h3 { margin: 0 0 8px; font-size: 14px; text-transform: capitalize; display: flex; justify-content: space-between; }
  .dept-card h3 .count { color: var(--muted); font-weight: 400; font-size: 12px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin: 8px 0 3px; }
  .bar-track { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .3s ease; }
  .bar-fill.warn { background: var(--warn); }
  .bar-fill.bad { background: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.queued { background: #ced4da33; color: var(--muted); }
  .badge.completed { background: #2f9e4433; color: var(--good); }
  .badge.escalated { background: #e8590c33; color: var(--warn); }
  .badge.failed { background: #e0313133; color: var(--bad); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 160px; }
  .field label { font-size: 11px; color: var(--muted); }
  input, select, textarea, button {
    font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
  }
  textarea { resize: vertical; min-height: 38px; flex: 1 1 100%; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .55; cursor: default; }
  #log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: pre-wrap;
    background: var(--track); border-radius: 6px; padding: 10px; max-height: 160px; overflow-y: auto; }
  .empty { color: var(--muted); font-style: italic; padding: 6px 0; }
  .recs li { margin-bottom: 4px; }
  .muted { color: var(--muted); }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  #task-table-wrap tbody tr { cursor: pointer; }
  #task-table-wrap tbody tr:hover { background: var(--track); }
  #task-table-wrap th.sortable { cursor: pointer; user-select: none; }
  #task-table-wrap th.sortable:hover { color: var(--text); }
  #task-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
  #task-detail dt { color: var(--muted); font-size: 12px; }
  #task-detail dd { margin: 0; }
  #task-detail .not-charged { color: var(--bad); }
  #task-detail ul { margin: 4px 0 0; padding-left: 18px; }
  #task-detail h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏢 Team Agent System</h1>
    <div class="toolbar">
      <span id="provider-badge">loading…</span>
      <button class="secondary" id="refresh-btn" type="button">↻ Refresh</button>
    </div>
  </header>

  <div class="stat-row" id="stat-row"></div>

  <div class="panel">
    <h2>Departments</h2>
    <div class="dept-grid" id="dept-grid"></div>
  </div>

  <div class="panel">
    <h2>Submit a Task</h2>
    <div class="row">
      <div class="field" style="flex: 1 1 100%;">
        <label for="f-desc">Description</label>
        <textarea id="f-desc" placeholder="e.g. Fix the login button not responding"></textarea>
      </div>
    </div>
    <div class="row" style="margin-top: 8px;">
      <div class="field">
        <label for="f-dept">Department (optional — auto-routed if blank)</label>
        <select id="f-dept"><option value="">auto</option></select>
      </div>
      <div class="field">
        <label for="f-hours">Estimated hours (optional)</label>
        <input id="f-hours" type="number" min="0" step="0.5" placeholder="auto">
      </div>
      <div class="field" style="flex: 0 0 auto;">
        <button id="submit-btn" type="button">Submit Task</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Tasks</h2>
    <div class="toolbar" style="margin-bottom: 10px;">
      <button id="process-btn" type="button">▶ Process Queue</button>
      <span class="muted" id="queue-hint"></span>
    </div>
    <div id="task-table-wrap"></div>
    <div id="log" hidden></div>
  </div>

  <div class="panel" id="task-detail" hidden>
    <div class="toolbar" style="justify-content: space-between;">
      <h2 style="margin:0;" id="task-detail-title">Task</h2>
      <button class="secondary" id="task-detail-close" type="button">✕ Close</button>
    </div>
    <div id="task-detail-body"></div>
  </div>

  <div class="panel">
    <h2>Recommendations</h2>
    <ul class="recs" id="recs-list"></ul>
  </div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);

function pctClass(pct) {
  if (pct >= 0.9) return "bad";
  if (pct >= 0.7) return "warn";
  return "";
}

function bar(label, pct, right) {
  const clamped = Math.max(0, Math.min(1, pct || 0));
  return `<div class="bar-label"><span>${label}</span><span>${right}</span></div>
    <div class="bar-track"><div class="bar-fill ${pctClass(clamped)}" style="width:${(clamped*100).toFixed(0)}%"></div></div>`;
}

function money(n) { return "$" + Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 0}); }
function moneyPrecise(n) { return "$" + Number(n || 0).toFixed(5); }

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `${res.status} ${res.statusText}`);
  return body;
}

async function loadStatus() {
  const status = await api("/api/status");
  $("#provider-badge").textContent = "LLM: " + status.llm_provider;

  const t = status.tasks;
  $("#stat-row").innerHTML = [
    ["Total", t.total], ["Queued", t.queued], ["Completed", t.completed],
    ["Escalated", t.escalated], ["Failed", t.failed],
  ].map(([label, value]) => `<div class="stat-tile"><div class="value">${value}</div><div class="label">${label}</div></div>`).join("");

  $("#dept-grid").innerHTML = status.departments.map(d => {
    const budget = d.budget
      ? bar("Budget", d.budget.utilization_pct, `${money(d.budget.spent)} / ${money(d.budget.allocated)}`)
      : `<div class="muted" style="font-size:12px;margin-top:8px;">budget not yet allocated</div>`;
    const capacity = d.capacity
      ? bar("Capacity", d.capacity.utilization_pct, `${d.capacity.workload}/${d.capacity.total} tasks`)
      : "";
    return `<div class="dept-card"><h3>${d.name}<span class="count">${d.task_count} task${d.task_count === 1 ? "" : "s"}</span></h3>${budget}${capacity}</div>`;
  }).join("");

  const deptSelect = $("#f-dept");
  const currentValue = deptSelect.value;
  deptSelect.innerHTML = `<option value="">auto</option>` +
    status.departments.map(d => `<option value="${d.name}">${d.name}</option>`).join("");
  deptSelect.value = currentValue;

  return status;
}

// Column headers a viewer can click to sort the Tasks table by; the fourth
// (quality_score) is what the Result column's badge actually renders, so
// "sort by Result" means "sort by quality_score", same as the badge itself.
const TASK_SORT_KEYS = {
  status: (t) => t.status,
  department: (t) => t.department,
  quality_score: (t) => t.quality_score,
};

// null/undefined sort key -> the original default (newest submitted first),
// same ordering the table always used before sorting existed. A column
// header click sets this; there's no separate "reset to default" control -
// clicking the same header again just flips direction.
let taskSortState = { key: null, dir: 1 };

function sortTasks(tasks) {
  if (!taskSortState.key) return tasks.slice().reverse();
  const getValue = TASK_SORT_KEYS[taskSortState.key];
  const dir = taskSortState.dir;
  return tasks
    .map((t, i) => [t, i])
    .sort(([a, ai], [b, bi]) => {
      const av = getValue(a);
      const bv = getValue(b);
      // Tasks that never computed a value (e.g. quality_score on a queued
      // or escalated task) sort after every task that has one, regardless
      // of sort direction - a "—" isn't a low value, it's a missing one.
      if (av == null && bv == null) return ai - bi;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return ai - bi;
    })
    .map(([t]) => t);
}

function sortableHeader(label, key) {
  const active = taskSortState.key === key;
  const arrow = active ? (taskSortState.dir === 1 ? " ▲" : " ▼") : "";
  return `<th class="sortable" data-sort-key="${key}">${label}${arrow}</th>`;
}

async function loadTasks() {
  const tasks = await api("/api/tasks");
  const queuedCount = tasks.filter(t => t.status === "queued").length;
  $("#queue-hint").textContent = queuedCount ? `${queuedCount} queued` : "nothing queued";
  $("#process-btn").disabled = queuedCount === 0;

  if (!tasks.length) {
    $("#task-table-wrap").innerHTML = `<div class="empty">No tasks yet — submit one above.</div>`;
    return;
  }
  const rows = sortTasks(tasks).map(t => {
    const desc = t.description.length > 70 ? t.description.slice(0, 67) + "…" : t.description;
    // quality_score/token_cost are only present once a task has actually
    // executed (see web_server._task_summary) - absence means "not yet
    // computed", same convention as the detail view, not a zero to render.
    const resultBadge = t.quality_score != null
      ? `★${t.quality_score}${t.token_cost != null ? ` · ${moneyPrecise(t.token_cost)}` : ""}`
      : "—";
    return `
    <tr data-task-id="${escapeHtml(t.id)}">
      <td>${escapeHtml(t.id)}</td>
      <td><span class="badge ${t.status}">${t.status}</span></td>
      <td>${escapeHtml(t.department)}</td>
      <td>${escapeHtml(desc)}</td>
      <td class="muted">${t.estimated_hours != null ? t.estimated_hours + "h" : "—"}</td>
      <td class="muted">${resultBadge}</td>
    </tr>`;
  }).join("");
  $("#task-table-wrap").innerHTML =
    `<table><thead><tr><th>ID</th>${sortableHeader("Status", "status")}${sortableHeader("Dept", "department")}<th>Description</th><th>Est.</th>${sortableHeader("Result", "quality_score")}</tr></thead><tbody>${rows}</tbody></table>`;
  $("#task-table-wrap").querySelectorAll("tr[data-task-id]").forEach(tr => {
    tr.addEventListener("click", () => openTaskDetail(tr.dataset.taskId));
  });
  $("#task-table-wrap").querySelectorAll("th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sortKey;
      taskSortState = taskSortState.key === key
        ? { key, dir: taskSortState.dir * -1 }
        : { key, dir: 1 };
      loadTasks();
    });
  });
}

// Tracks which task's detail panel is open so a "Process Queue" or the
// periodic refresh can update it in place - a completed/escalated task's
// real cost, quality score and tool usage only exist after processing, and
// a viewer looking right at the panel when that happens should see it land
// without having to re-click the row.
let openTaskId = null;

function renderTaskDetail(task) {
  $("#task-detail-title").textContent = `Task ${task.id}`;
  const parts = [];
  parts.push(`<dl>
    <dt>Status</dt><dd><span class="badge ${task.status}">${task.status}</span></dd>
    <dt>Department</dt><dd>${escapeHtml(task.department)}</dd>
    <dt>Description</dt><dd>${escapeHtml(task.description)}</dd>
    <dt>Created</dt><dd class="muted">${escapeHtml(task.created_at || "—")}</dd>
  </dl>`);

  // Mirrors main_v2.show_task() field-for-field, including its .get()
  // guards: an escalated-before-execution result (decision-engine
  // escalation or a budget denial) never computed these, so absence here
  // means "never ran," not "ran and was zero."
  const result = task.result;
  if (result) {
    parts.push(`<h3>Result</h3><dl>
      <dt>Summary</dt><dd>${escapeHtml(result.summary || "N/A")}</dd>
      <dt>Analysis</dt><dd>${escapeHtml(result.analysis || "N/A")}</dd>
    </dl>`);

    const extra = [];
    if (result.llm_provider) {
      extra.push(`<dt>LLM Provider</dt><dd>${escapeHtml(result.llm_provider)}</dd>`);
    }
    if (result.tokens_used) {
      const notCharged = result.token_cost_charged === false;
      const chargeNote = notCharged
        ? ` <span class="not-charged">[NOT CHARGED: ${escapeHtml(result.token_budget_note || "")}]</span>`
        : "";
      extra.push(`<dt>Tokens Used</dt><dd>${result.tokens_used} (${moneyPrecise(result.token_cost)})${chargeNote}</dd>`);
    }
    if (result.quality_score) {
      extra.push(`<dt>Quality Score</dt><dd>${escapeHtml(result.quality_score)}</dd>`);
    }
    if (result.used_tools) {
      extra.push(`<dt>Tool Calls</dt><dd>${result.tool_calls || 0} (${result.tool_calls_failed || 0} failed)</dd>`);
    }
    if (result.delegation_chain) {
      extra.push(`<dt>Delegation Chain</dt><dd>${result.delegation_chain.map(escapeHtml).join(" → ")}</dd>`);
    }
    if (result.delegation_declined) {
      extra.push(`<dt>Delegation Declined</dt><dd>${escapeHtml(result.delegation_declined)} (intended: ${escapeHtml(result.intended_delegate || "unknown")})</dd>`);
    }
    if (extra.length) parts.push(`<dl>${extra.join("")}</dl>`);

    if (result.execution_steps && result.execution_steps.length) {
      parts.push(`<h3>Staff Contributions</h3><ul>${
        result.execution_steps.map(s => `<li><strong>${escapeHtml(s.role || "Unknown")}</strong>: ${escapeHtml(s.contribution || "")}</li>`).join("")
      }</ul>`);
    }
  } else {
    parts.push(`<div class="muted" style="margin-top:10px;">Not yet processed — no result.</div>`);
  }

  $("#task-detail-body").innerHTML = parts.join("");
}

async function openTaskDetail(taskId) {
  openTaskId = taskId;
  $("#task-detail").hidden = false;
  try {
    renderTaskDetail(await api(`/api/tasks/${encodeURIComponent(taskId)}`));
  } catch (err) {
    $("#task-detail-body").innerHTML = `<div class="muted">${escapeHtml(err.message)}</div>`;
  }
}

async function refreshOpenTaskDetail() {
  if (!openTaskId || $("#task-detail").hidden) return;
  try {
    renderTaskDetail(await api(`/api/tasks/${encodeURIComponent(openTaskId)}`));
  } catch (err) {
    // Task since removed or unreachable - leave the last good render in
    // place rather than blanking a panel the viewer is actively reading.
  }
}

$("#task-detail-close").addEventListener("click", () => {
  $("#task-detail").hidden = true;
  openTaskId = null;
});

async function loadReport() {
  const report = await api("/api/report");
  const recs = [...report.recommendations, ...report.capacity_recommendations];
  $("#recs-list").innerHTML = recs.length
    ? recs.map(r => `<li><strong>${r.agent || r.department}</strong>: ${r.issue} — <span class="muted">${r.action}</span></li>`).join("")
    : `<li class="empty">No recommendations right now.</li>`;
}

async function refreshAll() {
  try {
    await Promise.all([loadStatus(), loadTasks(), loadReport(), refreshOpenTaskDetail()]);
  } catch (err) {
    console.error(err);
  }
}

function showLog(text) {
  const log = $("#log");
  if (!text) { log.hidden = true; return; }
  log.hidden = false;
  log.textContent = text;
}

$("#refresh-btn").addEventListener("click", refreshAll);

$("#submit-btn").addEventListener("click", async () => {
  const description = $("#f-desc").value.trim();
  if (!description) { $("#f-desc").focus(); return; }
  const department = $("#f-dept").value || undefined;
  const hoursRaw = $("#f-hours").value;
  const estimated_hours = hoursRaw === "" ? undefined : Number(hoursRaw);

  $("#submit-btn").disabled = true;
  try {
    const result = await api("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ description, department, estimated_hours }),
    });
    showLog(result.log);
    $("#f-desc").value = "";
    $("#f-hours").value = "";
    await refreshAll();
  } catch (err) {
    showLog("Error: " + err.message);
  } finally {
    $("#submit-btn").disabled = false;
  }
});

$("#process-btn").addEventListener("click", async () => {
  $("#process-btn").disabled = true;
  try {
    const result = await api("/api/process", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({}),
    });
    showLog(result.log);
    await refreshAll();
  } catch (err) {
    showLog("Error: " + err.message);
  }
});

refreshAll();
setInterval(refreshAll, 8000);
</script>
</body>
</html>
